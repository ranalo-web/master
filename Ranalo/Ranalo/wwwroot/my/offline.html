<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#213b4a" />
    <title>Offline · Ranalo</title>
    <style>
        body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #16202a; }
        header { background: #213b4a; color: #fff; padding: 16px; border-bottom: 4px solid #fcdfb0; font-weight: 700; font-size: 20px; }
        main { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
        .card { background: #fff; border: 1px solid #e3e8ee; border-radius: 14px; padding: 16px; margin-top: 16px; }
        button { width: 100%; margin-top: 16px; padding: 15px; border: 0; border-radius: 12px; background: #213b4a; color: #fff; font-size: 17px; font-weight: 700; }
    </style>
</head>
<body>
    <header>Ranalo</header>
    <main>
        <h1 style="font-size:22px;">You're offline</h1>
        <p>Connect to data or Wi-Fi to see your account.</p>
        <div class="card">
            <b>You can still pay with M-Pesa:</b>
            <ol>
                <li>M-Pesa, then Lipa na M-Pesa, then Pay Bill</li>
                <li>Business no: <b>4090703</b></li>
                <li>Account no: your account number</li>
            </ol>
            Help: call 0772 007 007
        </div>
        <button onclick="location.reload()">Try again</button>
    </main>
</body>
</html>
